<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Monitor</title>
<!--
  tetris_monitor.html
  PC-side display for the PIC18F4520 Tetris project (replaces the console view).

  Reads the same 208-byte UART frame as tetris_uart.cpp through the Web Serial API:
    [0..1] A5 5A   [2..201] 10x20 board (0 empty, 1 locked, 2 active)
    [202..203] score (big-endian)  [204] lines  [205] level
    [206] state (0 run, 1 pause, 2 over)  [207] XOR of bytes 0..206

  Open in Chrome or Edge, press "連線序列埠", pick the USB-TTL COM port.
  "示範模式" runs a local auto-playing game that is encoded into the same frames
  and fed through the same parser, so the display can be tested without hardware.

  The frame only says "locked" or "active", so piece colours are inferred on the PC:
  the active piece is identified by its shape, and its colour is kept when it locks.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1b2330; --line:#2a3443; --fg:#e6edf3; --muted:#8b98a9;
  --accent:#4fd1a5; --warn:#f2b84b; --bad:#f2705e;
  --f-num:"Chakra Petch","Segoe UI",sans-serif; --f-body:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 30% -10%,#1a2433 0%,var(--bg) 60%);color:var(--fg);font-family:var(--f-body);font-size:15px}
.app{max-width:980px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{font-family:var(--f-num);font-weight:700;letter-spacing:.12em;font-size:20px;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-weight:400;letter-spacing:0;font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.status.demo .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
button{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#08251a;font-weight:700}
button[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
@media (max-width:720px){main{grid-template-columns:1fr;justify-items:center}}
.well{position:relative;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45)}
canvas{display:block;border-radius:6px}
.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(13,17,23,.72);border-radius:6px;font-family:var(--f-num);font-weight:700;letter-spacing:.15em;font-size:30px;text-align:center}
.overlay small{font-family:var(--f-body);font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted)}
.pop{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--f-num);font-weight:700;font-size:28px;letter-spacing:.1em;color:var(--warn);text-shadow:0 0 18px rgba(242,184,75,.6);pointer-events:none;opacity:0;transform:translateY(10px)}
.pop.show{animation:pop 900ms ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.9)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

.side{display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.score{font-family:var(--f-num);font-weight:700;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.big{font-family:var(--f-num);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.state{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel2)}
.state.run{color:var(--accent)} .state.pause{color:var(--warn)} .state.over{color:var(--bad)}
.meter{height:6px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--warn),var(--bad));transition:width .2s}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.v{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.v.bad{color:var(--bad)}
.hint{font-size:13px;color:var(--muted);line-height:1.6}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:4px}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.pop.show{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">TETRIS MONITOR<small>PIC18F4520 ・ UART 115200 8N1</small></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">未連線</span></div>
    <button class="primary" id="btnConnect" type="button">連線序列埠</button>
    <button id="btnDemo" type="button" aria-pressed="false">示範模式</button>
    <button id="btnNoise" type="button" aria-pressed="false" title="示範模式下隨機插入錯誤位元組，展示檢查碼與重新同步">注入雜訊</button>
  </header>

  <main>
    <div class="well" id="well">
      <canvas id="board" aria-label="俄羅斯方塊盤面"></canvas>
      <div class="overlay" id="overlay"><span id="ovTitle">等待資料</span><small id="ovSub">按「連線序列埠」或「示範模式」</small></div>
      <div class="pop" id="pop"></div>
    </div>

    <div class="side">
      <div class="card">
        <div class="label">SCORE</div>
        <div class="score" id="score">0</div>
        <div class="grid2">
          <div><div class="label">LINES</div><div class="big" id="lines">0</div></div>
          <div><div class="label">LEVEL</div><div class="big" id="level">1</div></div>
          <div><div class="label">STATE</div><div style="margin-top:6px"><span class="state run" id="state">—</span></div></div>
        </div>
        <div style="margin-top:14px"><div class="label">堆疊高度 <span id="hText">0 / 20</span></div><div class="meter"><span id="hBar" style="width:0%"></span></div></div>
      </div>

      <div class="card">
        <div class="label" style="margin-bottom:6px">通訊狀態</div>
        <table>
          <tr><td>有效封包</td><td class="v" id="sFrames">0</td></tr>
          <tr><td>每秒封包</td><td class="v" id="sRate">0</td></tr>
          <tr><td>檢查碼錯誤</td><td class="v" id="sBad">0</td></tr>
          <tr><td>丟棄位元組</td><td class="v" id="sDrop">0</td></tr>
          <tr><td>距上一包</td><td class="v" id="sAge">—</td></tr>
        </table>
      </div>

      <p class="hint" id="hint">接上 USB-TTL 後按「連線序列埠」，選擇 CH340 的 COM 埠。PIC 只傳「固定方塊／活動方塊」，顏色由電腦依方塊形狀判斷；半透明外框是落點預覽。</p>
    </div>
  </main>
</div>

<script>
'use strict';
/* ---------------- Protocol (same as tetris_uart.cpp) ---------------- */
const W = 10, H = 20, FRAME = 208, H0 = 0xA5, H1 = 0x5A;

function xorSum(buf, start, n){ let s = 0; for (let i = 0; i < n; i++) s ^= buf[start + i]; return s; }

class FrameParser {
  constructor(){ this.buf = new Uint8Array(16384); this.len = 0; this.stats = { frames:0, bad:0, dropped:0 }; }
  drop(n){ this.buf.copyWithin(0, n, this.len); this.len -= n; }
  feed(bytes){
    if (this.len + bytes.length > this.buf.length) {           // noisy line: keep memory bounded
      const keep = Math.min(this.len, 1024);
      this.stats.dropped += this.len - keep; this.drop(this.len - keep);
      if (bytes.length > this.buf.length - this.len) bytes = bytes.subarray(bytes.length - (this.buf.length - this.len));
    }
    this.buf.set(bytes, this.len); this.len += bytes.length;
    const out = [];
    for (;;) {
      let s = 0;
      while (s + 1 < this.len && !(this.buf[s] === H0 && this.buf[s + 1] === H1)) s++;
      // No header found: drop everything except a trailing A5 that may start the next frame.
      if (s + 1 >= this.len && this.buf[s] !== H0) s = this.len;
      if (s > 0) { this.stats.dropped += s; this.drop(s); }
      if (this.len < FRAME) break;
      if (xorSum(this.buf, 0, FRAME - 1) === this.buf[FRAME - 1]) {
        const b = this.buf;
        out.push({ board: b.slice(2, 202), score: (b[202] << 8) | b[203], lines: b[204], level: b[205], state: b[206] });
        this.stats.frames++; this.drop(FRAME);
      } else { this.stats.bad++; this.stats.dropped++; this.drop(1); }  // resync one byte later
    }
    return out;
  }
}

function encodeFrame(board, score, lines, level, state){
  const f = new Uint8Array(FRAME);
  f[0] = H0; f[1] = H1; f.set(board, 2);
  score = Math.min(score, 65535);
  f[202] = score >> 8; f[203] = score & 255; f[204] = lines & 255; f[205] = level; f[206] = state;
  f[207] = xorSum(f, 0, FRAME - 1);
  return f;
}

/* ---------------- Pieces and colours ---------------- */
const SHAPES = { I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]] };
const COLORS = { I:'#3ec7e0', O:'#f2c94c', T:'#b07cf0', S:'#5ad17a', Z:'#f06a5e', J:'#4f8ef0', L:'#f29b4b', G:'#6b7787' };
const KEYS = Object.keys(SHAPES);
const rotate = cells => cells.map(([x, y]) => [3 - y, x]);
function norm(cells){ const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); }
const keyOf = cells => norm(cells).map(c => c.join(',')).join(';');
const SHAPE_LOOKUP = {}; const ROTS = {};
for (const k of KEYS) { let c = SHAPES[k]; ROTS[k] = []; for (let r = 0; r < 4; r++) { ROTS[k].push(c); SHAPE_LOOKUP[keyOf(c)] = k; c = rotate(c); } }

/* ---------------- Display state with colour tracking ---------------- */
const view = { prev:null, colors:new Array(W * H).fill(null), activeType:null, lastFrameAt:0, times:[] };

function activeCells(board){ const a = []; for (let i = 0; i < W * H; i++) if (board[i] === 2) a.push([i % W, (i / W) | 0]); return a; }
function fixedOf(board){ return Array.from(board, v => v === 1); }

// Work out which colours the locked cells should have after this frame.
function trackColors(fr){
  const prev = view.prev, b = fr.board;
  const act = activeCells(b);
  view.activeType = act.length === 4 ? (SHAPE_LOOKUP[keyOf(act.map(c => c.slice()))] || null) : null;
  if (!prev) { view.colors = Array.from(b, v => v === 1 ? 'G' : null); return []; }
  const pf = fixedOf(prev.board), nf = fixedOf(b);
  if (pf.every((v, i) => v === nf[i])) return [];                 // nothing locked or cleared
  let cleared = [];
  const pAct = activeCells(prev.board);
  const pType = pAct.length === 4 ? SHAPE_LOOKUP[keyOf(pAct.map(c => c.slice()))] : null;
  if (pAct.length) {
    // Assume the previous active piece fell straight down (soft/hard drop) and locked.
    let d = 0;
    const free = dd => pAct.every(([x, y]) => y + dd < H && !pf[(y + dd) * W + x]);
    while (free(d + 1)) d++;
    const col = pf.map((v, i) => v ? view.colors[i] : null);
    const occ = pf.slice();
    for (const [x, y] of pAct) { occ[(y + d) * W + x] = true; col[(y + d) * W + x] = pType || 'G'; }
    const keepOcc = [], keepCol = [];
    for (let r = H - 1; r >= 0; r--) {
      const row = occ.slice(r * W, r * W + W);
      if (row.every(Boolean)) { cleared.push(r); continue; }
      keepOcc.unshift(...row); keepCol.unshift(...col.slice(r * W, r * W + W));
    }
    while (keepOcc.length < W * H) { keepOcc.unshift(...new Array(W).fill(false)); keepCol.unshift(...new Array(W).fill(null)); }
    if (keepOcc.every((v, i) => v === nf[i])) { view.colors = keepCol; return cleared; }
  }
  // Fallback (missed frames, garbage rows, new game): keep known colours, grey for the rest.
  view.colors = nf.map((v, i) => v ? (view.colors[i] && pf[i] ? view.colors[i] : 'G') : null);
  return cleared;
}

/* ---------------- Rendering ---------------- */
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
let CELL = 30;
function sizeCanvas(){
  const avail = Math.min(window.innerHeight - 150, 680);
  CELL = Math.max(16, Math.min(34, Math.floor(avail / H)));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = CELL * W + 'px'; cv.style.height = CELL * H + 'px';
  cv.width = CELL * W * dpr; cv.height = CELL * H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function shade(hex, amt){ const n = parseInt(hex.slice(1), 16); const c = s => Math.max(0, Math.min(255, ((n >> s) & 255) + amt));
  return `rgb(${c(16)},${c(8)},${c(0)})`; }
function block(x, y, color, alpha = 1){
  const px = x * CELL, py = y * CELL, s = CELL, r = Math.max(2, s * .14);
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(px, py, px, py + s);
  g.addColorStop(0, shade(color, 40)); g.addColorStop(1, shade(color, -30));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(px + 1.5, py + 1.5, s - 3, s - 3, r); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(px + 4, py + 3.5, s - 8, Math.max(2, s * .1));
  ctx.globalAlpha = 1;
}
let flash = null;
function draw(){
  ctx.clearRect(0, 0, CELL * W, CELL * H);
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, CELL * W, CELL * H);
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
  for (let x = 1; x < W; x++) { ctx.beginPath(); ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H * CELL); ctx.stroke(); }
  for (let y = 1; y < H; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W * CELL, y * CELL + .5); ctx.stroke(); }
  const fr = view.prev; if (!fr) return;
  const b = fr.board;
  for (let i = 0; i < W * H; i++) if (b[i] === 1) block(i % W, (i / W) | 0, COLORS[view.colors[i] || 'G']);
  const act = activeCells(b);
  if (act.length && fr.state !== 2) {
    const color = COLORS[view.activeType || 'G'];
    let d = 0; const free = dd => act.every(([x, y]) => y + dd < H && b[(y + dd) * W + x] !== 1);
    while (free(d + 1)) d++;
    if (d > 0) { ctx.strokeStyle = color; ctx.globalAlpha = .55; ctx.lineWidth = 2;
      for (const [x, y] of act) { ctx.beginPath(); ctx.roundRect(x * CELL + 3, (y + d) * CELL + 3, CELL - 6, CELL - 6, 3); ctx.stroke(); }
      ctx.globalAlpha = 1; }
    for (const [x, y] of act) block(x, y, color);
  }
  if (flash) {
    const t = (performance.now() - flash.at) / 300;
    if (t < 1) { ctx.fillStyle = `rgba(255,255,255,${.35 * (1 - t)})`; ctx.fillRect(0, 0, CELL * W, CELL * H); requestAnimationFrame(draw); }
    else flash = null;
  }
}

/* ---------------- UI updates ---------------- */
const $ = id => document.getElementById(id);
const STATE_TXT = ['RUNNING', 'PAUSED', 'GAME OVER'];
let parser = new FrameParser();
function onFrame(fr){
  const prevLines = view.prev ? view.prev.lines : fr.lines;
  const cleared = trackColors(fr);
  view.prev = fr;
  const now = performance.now(); view.lastFrameAt = now; view.times.push(now);
  const n = (fr.lines - prevLines + 256) & 255;
  if (n > 0 && n <= 4) { flash = { at: now }; popText(['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS!'][n]); }
  $('score').textContent = fr.score.toLocaleString('en-US');
  $('lines').textContent = fr.lines; $('level').textContent = fr.level;
  const st = $('state'); st.textContent = STATE_TXT[fr.state] || '?';
  st.className = 'state ' + (['run', 'pause', 'over'][fr.state] || '');
  let top = H; for (let i = 0; i < W * H; i++) if (fr.board[i] === 1) { top = (i / W) | 0; break; }
  const h = H - top; $('hText').textContent = `${h} / ${H}`; $('hBar').style.width = (h / H * 100) + '%';
  const ov = $('overlay');
  if (fr.state === 1) { ov.hidden = false; $('ovTitle').textContent = 'PAUSE'; $('ovSub').textContent = '按 RB5 繼續'; }
  else if (fr.state === 2) { ov.hidden = false; $('ovTitle').textContent = 'GAME OVER'; $('ovSub').textContent = '按 RB5 重新開始'; }
  else ov.hidden = true;
  draw();
}
function popText(t){ const p = $('pop'); p.textContent = t; p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); }
function feed(bytes){ for (const fr of parser.feed(bytes)) onFrame(fr); }
setInterval(() => {
  const now = performance.now(); view.times = view.times.filter(t => now - t < 1000);
  const s = parser.stats;
  $('sFrames').textContent = s.frames; $('sRate').textContent = view.times.length;
  $('sBad').textContent = s.bad; $('sBad').classList.toggle('bad', s.bad > 0);
  $('sDrop').textContent = s.dropped;
  $('sAge').textContent = view.lastFrameAt ? Math.round(now - view.lastFrameAt) + ' ms' : '—';
}, 250);
function setStatus(kind, text){ const s = $('status'); s.className = 'status ' + kind; $('statusText').textContent = text; }
function resetView(){ parser = new FrameParser(); view.prev = null; view.colors.fill(null); view.lastFrameAt = 0; view.times = []; draw(); }

/* ---------------- Web Serial ---------------- */
let port = null, reader = null;
async function connect(){
  if (!('serial' in navigator)) { $('hint').innerHTML = '<span class="err">這個瀏覽器不支援 Web Serial。</span>請用 Chrome 或 Edge 開啟本檔。'; return; }
  if (port) { await disconnect(); return; }
  stopDemo();
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200, dataBits: 8, parity: 'none', stopBits: 1, bufferSize: 4096 });
  } catch (e) { port = null; if (e.name !== 'NotFoundError') $('hint').innerHTML = `<span class="err">無法開啟序列埠：${e.message}</span> 確認沒有其他程式（例如 tetris_uart.exe 或 MPLAB）正在使用這個 COM 埠。`; return; }
  resetView(); setStatus('on', '已連線 115200'); $('btnConnect').textContent = '中斷連線';
  $('ovTitle').textContent = '等待資料'; $('ovSub').textContent = '已連線，等待 PIC 傳送封包';
  readLoop();
}
async function readLoop(){
  while (port && port.readable) {
    reader = port.readable.getReader();
    try { for (;;) { const { value, done } = await reader.read(); if (done) break; if (value) feed(value); } }
    catch (e) { /* framing error or unplugged: try again while the port is open */ }
    finally { reader.releaseLock(); reader = null; }
  }
}
async function disconnect(){
  const p = port; port = null;
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (p) await p.close(); } catch (e) {}
  setStatus('', '未連線'); $('btnConnect').textContent = '連線序列埠';
}
if ('serial' in navigator) navigator.serial.addEventListener('disconnect', e => { if (e.target === port) disconnect(); });

/* ---------------- Demo: local auto-playing game encoded as real frames ---------------- */
const demo = { timer:null, noise:false };
function newGame(){ return { board:new Uint8Array(W * H), score:0, lines:0, events:0, level:1, state:0, piece:null, plan:[], overAt:0, tick:0 }; }
function cellsOf(p){ return ROTS[p.t][p.r].map(([x, y]) => [x + p.x, y + p.y]); }
function fits(board, p){ return cellsOf(p).every(([x, y]) => x >= 0 && x < W && y < H && (y < 0 || !board[y * W + x])); }
function evalBoard(board){
  const hts = []; let holes = 0;
  for (let x = 0; x < W; x++) { let h = 0, seen = false;
    for (let y = 0; y < H; y++) { if (board[y * W + x]) { if (!seen) { h = H - y; seen = true; } } else if (seen) holes++; }
    hts.push(h); }
  let bump = 0; for (let x = 0; x < W - 1; x++) bump += Math.abs(hts[x] - hts[x + 1]);
  return { agg: hts.reduce((a, b) => a + b, 0), holes, bump };
}
function clearRows(board){ let n = 0; for (let y = H - 1; y >= 0; y--) { let full = true; for (let x = 0; x < W; x++) if (!board[y * W + x]) { full = false; break; }
    if (full) { board.copyWithin(W, 0, y * W); board.fill(0, 0, W); n++; y++; } } return n; }
function planMove(g){
  let best = null;
  for (let r = 0; r < 4; r++) for (let x = -2; x < W; x++) {
    const p = { t:g.piece.t, r, x, y:0 }; if (!fits(g.board, p)) continue;
    while (fits(g.board, { ...p, y:p.y + 1 })) p.y++;
    const b = g.board.slice(); for (const [cx, cy] of cellsOf(p)) if (cy >= 0) b[cy * W + cx] = 1;
    const lines = clearRows(b), e = evalBoard(b);
    const score = -0.51 * e.agg + 0.76 * lines - 0.36 * e.holes - 0.18 * e.bump + Math.random() * 0.05;
    if (!best || score > best.score) best = { score, r, x };
  }
  const plan = []; if (!best) return plan;
  for (let i = 0; i < best.r; i++) plan.push('rot');
  const dx = best.x - g.piece.x; for (let i = 0; i < Math.abs(dx); i++) plan.push(dx < 0 ? 'left' : 'right');
  plan.push(Math.random() < .5 ? 'hard' : 'soft');
  return plan;
}
function spawn(g){
  g.piece = { t:KEYS[(Math.random() * 7) | 0], r:0, x:3, y:0 };
  if (!fits(g.board, g.piece)) { g.state = 2; g.overAt = g.tick; return; }
  g.plan = planMove(g);
}
function lock(g){
  for (const [x, y] of cellsOf(g.piece)) if (y >= 0) g.board[y * W + x] = 1;
  const n = clearRows(g.board);
  if (n) { g.score += [0, 100, 300, 500, 800][n]; g.lines += n; g.events++; g.level = Math.min(10, 1 + (g.events >> 2)); }
  spawn(g);
}
function step(g){
  g.tick++;
  if (g.state === 2) { if (g.tick - g.overAt > 30) Object.assign(g, newGame(), { tick:g.tick }), spawn(g); return; }
  const a = g.plan[0];
  if (a === 'rot') { const p = { ...g.piece, r:(g.piece.r + 1) & 3 }; if (fits(g.board, p)) g.piece = p; g.plan.shift(); }
  else if (a === 'left' || a === 'right') { const p = { ...g.piece, x:g.piece.x + (a === 'left' ? -1 : 1) }; if (fits(g.board, p)) g.piece = p; g.plan.shift(); }
  else if (a === 'hard') { while (fits(g.board, { ...g.piece, y:g.piece.y + 1 })) g.piece.y++; lock(g); }
  else { const p = { ...g.piece, y:g.piece.y + 1 }; if (fits(g.board, p)) g.piece = p; else lock(g); }
}
function emit(g){
  const b = g.board.slice();
  if (g.state !== 2 && g.piece) for (const [x, y] of cellsOf(g.piece)) if (y >= 0) b[y * W + x] = 2;
  let f = encodeFrame(b, g.score, g.lines, g.level, g.state);
  if (demo.noise && Math.random() < .25) {           // corrupt a byte or add junk to show resync
    f = f.slice();
    if (Math.random() < .5) f[2 + ((Math.random() * 200) | 0)] ^= 0x40;
    else { const j = new Uint8Array(1 + ((Math.random() * 5) | 0)).map(() => (Math.random() * 256) | 0); feed(j); }
  }
  // Split into chunks like a real serial port delivers them.
  for (let i = 0; i < f.length; i += 64) feed(f.subarray(i, i + 64));
}
function startDemo(){
  if (port) disconnect();
  resetView(); const g = newGame(); spawn(g);
  demo.timer = setInterval(() => { step(g); emit(g); }, 70);
  setStatus('demo', '示範模式'); $('btnDemo').setAttribute('aria-pressed', 'true'); $('btnDemo').textContent = '停止示範';
}
function stopDemo(){
  if (!demo.timer) return;
  clearInterval(demo.timer); demo.timer = null;
  setStatus('', '未連線'); $('btnDemo').setAttribute('aria-pressed', 'false'); $('btnDemo').textContent = '示範模式';
}

$('btnConnect').addEventListener('click', connect);
$('btnDemo').addEventListener('click', () => demo.timer ? stopDemo() : startDemo());
$('btnNoise').addEventListener('click', () => { demo.noise = !demo.noise; $('btnNoise').setAttribute('aria-pressed', String(demo.noise)); });
window.addEventListener('resize', sizeCanvas);
sizeCanvas();
if (!('serial' in navigator)) $('hint').innerHTML = '<span class="err">這個瀏覽器不支援 Web Serial，</span>只能使用示範模式。連接 PIC 請改用 Chrome 或 Edge。';
if (location.hash === '#demo') startDemo();
</script>
</body>
